<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日英语">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>每日英语 English Daily</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1c1e24;--sub:#6b7080;--line:#e4e6ee;--accent:#2f6bff;--ok:#1aa260;--bad:#e5484d;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1c1f26;--text:#eceef3;--sub:#9aa0ae;--line:#2b2f39;--accent:#5b8cff;--chip:#232a3d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;touch-action:manipulation;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 18px) 8px calc(env(safe-area-inset-left) + 18px)}
header h1{margin:0;font-size:26px;font-weight:800}
header .meta{color:var(--sub);font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
main{padding:4px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px);max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.label{font-size:13px;color:var(--sub);letter-spacing:.5px;margin-bottom:6px}
.big{font-size:34px;font-weight:800;line-height:1.15;word-break:break-word}
.sent{font-size:22px;font-weight:700;line-height:1.35}
.ph{color:var(--sub);font-size:16px}
.kw{border-radius:5px;transition:background .08s,color .08s}
.kw.on{background:#ffd54a;color:#1c1e24;box-shadow:0 0 0 2px #ffd54a}
.kw.past{color:var(--accent)}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 2px}
.pbar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.speed button{min-height:48px;border-radius:12px;background:var(--chip);color:var(--text);font-size:16px;font-weight:600}
.speed button.on{background:var(--accent);color:#fff}
.hint{color:var(--sub);font-size:14px;margin-top:2px;opacity:.9}
.hint::before{content:"谐音 ";font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 4px;margin-right:4px;vertical-align:1px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.scene{background:var(--card);border-radius:16px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.scene b{font-size:28px;font-weight:400;line-height:1.1}.scene small{color:var(--sub);font-size:12px}
.dl{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;font-size:17px}
.dl:last-child{border:0}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.line:last-child{border:0}
.line.cur{background:var(--chip);border-radius:12px;margin:0 -10px;padding:12px 10px}
.who{min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:#2f6bff;margin-top:2px}
.who.B{background:#e5548f}
.line .en{font-size:18px;font-weight:600}.line .cn{color:var(--sub);font-size:15px}
.back{min-height:48px;background:none;color:var(--accent);font-size:17px;padding:0 4px;margin-left:-4px}
.zh{font-size:18px;margin-top:8px}
.ex{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ex .en{font-size:18px}.ex .cn{color:var(--sub);font-size:15px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{min-height:52px;border-radius:14px;padding:0 18px;font-size:17px;font-weight:600;background:var(--chip);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%}
.spk{width:52px;height:52px;min-width:52px;border-radius:50%;background:var(--chip);font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.spk:active{transform:scale(.92)}
.hidden{display:none!important}
.reveal{margin-top:14px;min-height:56px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:16px;width:100%;background:transparent}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{min-height:56px;border-radius:14px;background:var(--chip);text-align:left;padding:10px 16px;font-size:17px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 6px) env(safe-area-inset-left)}
nav button{flex:1;min-height:56px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub);gap:2px}
nav button b{font-size:22px;font-weight:400;line-height:1}
nav button.on{color:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div{background:var(--card);border-radius:16px;padding:14px 4px}
.stat strong{display:block;font-size:28px}
.stat span{font-size:13px;color:var(--sub)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px;min-height:52px}
.list .it:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--sub);white-space:nowrap}
.done{text-align:center;padding:28px 20px}
.done .e{font-size:56px}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.sw{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:.2s}
.sw.on{background:var(--ok)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:23px}
small.note{color:var(--sub);font-size:13px;display:block;margin-top:6px}

.task{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;background:var(--bg);border-radius:14px;padding:8px 12px;margin-top:8px;text-align:left}
.task .ti{width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px}
.task b{display:block;font-size:16px}.task small{color:var(--sub);font-size:13px}
.task .go{color:var(--sub);font-size:22px}
.task.done .ti{background:var(--ok);color:#fff;font-weight:700}.task.done b{color:var(--sub);text-decoration:line-through}
.qtitle{font-size:18px;font-weight:700;margin-bottom:14px}
.listen-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px auto 4px;width:120px;height:120px;border-radius:28px;background:var(--accent);color:#fff;font-size:44px;box-shadow:0 6px 0 #1d4fd1}
.listen-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1d4fd1}
.listen-btn small{font-size:13px;margin-top:2px}
.zhq{font-size:20px;font-weight:600;margin-bottom:12px}
.answer{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:14px}
.answer.good{border-color:var(--ok)}.answer.badans{border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;margin-bottom:16px;justify-content:center}
.tile{min-height:48px;padding:0 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;font-size:18px;font-weight:600}
.tile:active{transform:translateY(2px)}
.btn:disabled{opacity:.4}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);border-radius:22px 22px 0 0;animation:up .25s ease-out;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.sheet.ok{background:#d7f5e3;color:#0d6b3a}.sheet.bad{background:#fde2e2;color:#a3262a}
.sheet .sh-t{font-size:20px;font-weight:800;margin-bottom:4px}.sheet .sh-a{font-size:14px}.sheet .sh-en{font-size:18px;font-weight:600}.sheet .sh-zh{font-size:15px;opacity:.85;margin-bottom:12px}
.sheet.ok .btn{background:var(--ok);color:#fff}.sheet.bad .btn{background:var(--bad);color:#fff}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:70;background:#1c1e24;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;width:max-content;max-width:88vw;text-align:center;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
.onb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 0 calc(env(safe-area-inset-bottom) + 16px)}
.onb-card{background:var(--card);width:min(94vw,520px);border-radius:24px;padding:26px 22px 18px;text-align:center}
.onb-card .e{font-size:60px}.onb-card h2{margin:6px 0 8px;font-size:22px}.onb-card p{color:var(--sub);margin:0 0 14px;font-size:16px;line-height:1.6}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{width:22px;background:var(--accent)}
.skip{background:none;color:var(--sub);min-height:44px;width:100%;margin-top:4px;font-size:15px}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip)}.pill:empty{display:none}
.pill.ok{color:var(--ok)}.pill.warn{color:#b26b00}.pill.busy{color:var(--accent)}
.mic.recording{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.25)}}
.btn.mine{min-height:44px;font-size:14px;padding:0 10px;margin-left:4px}
.spkcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.label{font-size:14px}
#learnBox,.line,.card{scroll-margin-top:96px}
</style>
</head>
<body>
<header>
  <h1 id="title">今日英语</h1>
  <div class="meta"><span id="dateTxt"></span><span id="streakTxt"></span><span id="netTxt" class="pill"></span></div>
</header>
<main>
  <!-- TODAY -->
  <section id="v-today">
    <div class="card" id="tasks"></div>
    <div class="label" style="margin:16px 4px 0">今日单词 <span id="wCount"></span></div>
    <div class="progress"><i id="wBar" style="width:0"></i></div>
    <div id="learnBox"></div>
    <div class="card">
      <div class="label">📌 今日一句 · <span id="sScene"></span></div>
      <div class="row"><div class="grow sent" id="sEn"></div><div class="spkcol"><button class="spk" data-say="sEn" aria-label="朗读">🔊</button><button class="spk mic" data-mic="daily" aria-label="跟读录音">🎤</button></div></div>
      <div class="hint" id="sHint"></div><div class="zh" id="sZh"></div>
      <div class="label" style="margin:12px 0 0">🎚️ 朗读速度</div><div class="speed" data-speed></div>
    </div>
  </section>

  <!-- DIALOGUE -->
  <section id="v-dlg" class="hidden"><div id="dlgBox"></div></section>

  <!-- REVIEW -->
  <section id="v-review" class="hidden"><div id="reviewBox"></div></section>

  <!-- QUIZ -->
  <section id="v-quiz" class="hidden"><div id="quizBox"></div></section>

  <!-- STATS -->
  <section id="v-stats" class="hidden">
    <div class="stat" style="margin-top:8px">
      <div><strong id="stStreak">0</strong><span>连续天数</span></div>
      <div><strong id="stLearned">0</strong><span>已学单词</span></div>
      <div><strong id="stMaster">0</strong><span>已掌握</span></div>
    </div>
    <div class="card">
      <div class="label" style="margin:0">🎚️ 朗读速度</div><div class="speed" data-speed></div><div style="height:8px"></div>
      <div class="toggle"><span>🔁 学单词时自动朗读</span><button class="sw" id="autoSw" aria-label="自动朗读"></button></div>
      <small class="note">播放时会高亮正在读的单词并显示进度条。声音为预录真人风格语音，静音模式下也能播放（请把音量调大）。所有学习记录只保存在本机。</small>
    </div>
    <div class="card list" id="wordList"></div>
    <button class="btn full" id="resetBtn" style="color:var(--bad)">清空学习记录</button>
  </section>
</main>
<nav>
  <button data-v="today" class="on"><b>📖</b>今日</button>
  <button data-v="dlg"><b>💬</b>对话</button>
  <button data-v="review"><b>🔄</b>复习<span id="dueBadge"></span></button>
  <button data-v="quiz"><b>🎯</b>练习</button>
  <button data-v="stats"><b>📊</b>进度</button>
</nav>
<script src="words.js"></script>
<script src="hints.js"></script>
<script src="dialogues.js"></script>
<script src="timings.js"></script>
<script>
(()=>{
const PER_DAY=5, KEY='englishDaily.v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayNum=s=>Math.round(new Date(s+'T00:00:00')/864e5);
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({start:todayStr(),cards:{},days:{},auto:true},S||{});
if(!S.rate)S.rate=S.slow?0.75:1;delete S.slow;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const T=todayStr(), DI=dayNum(T)-dayNum(S.start);
save();

// ---- audio: pre-generated MP3 via one HTML5 <audio> element (plays with silent switch on); speechSynthesis only as fallback ----
const player=new Audio();player.preload='auto';player.setAttribute('playsinline','');
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let lastText='',seq=null,cur=null,raf=0;
player.onerror=()=>{endCur();if(lastText)tts(lastText,seqNext)};
player.onended=()=>{endCur(true);seqNext()};
function applyRate(){player.defaultPlaybackRate=S.rate;player.playbackRate=S.rate;player.preservesPitch=true;player.webkitPreservesPitch=true;player.mozPreservesPitch=true}
// karaoke: wrap the element's text in word spans using edge-tts word boundaries (TIMINGS) or proportional fallback
function prepKaraoke(el,key){
  if(!el)return null;
  const text=el.dataset.raw||(el.dataset.raw=el.textContent);
  const b=(window.TIMINGS&&TIMINGS[key])||null;
  el.textContent='';const spans=[];let pos=0;const words=[];
  if(b&&b.length){let p=0;for(const [o,d,w] of b){const k=text.indexOf(w,p);if(k<0)continue;words.push([k,k+w.length,o/100,(o+d)/100]);p=k+w.length}}
  if(!words.length){const re=/[A-Za-z0-9'’.$%-]+/g;let m;while((m=re.exec(text)))words.push([m.index,m.index+m[0].length,null,null])}
  for(const w of words){if(w[0]>pos)el.appendChild(document.createTextNode(text.slice(pos,w[0])));
    const sp=document.createElement('span');sp.className='kw';sp.textContent=text.slice(w[0],w[1]);el.appendChild(sp);spans.push({sp,t0:w[2],t1:w[3],len:w[1]-w[0]});pos=w[1]}
  if(pos<text.length)el.appendChild(document.createTextNode(text.slice(pos)));
  let bar=el.nextElementSibling;
  if(!bar||!bar.classList.contains('pbar')){bar=document.createElement('div');bar.className='pbar';bar.innerHTML='<i></i>';el.after(bar)}
  bar.classList.remove('hidden');bar.firstChild.style.width='0';
  return {el,spans,bar,timed:spans.length>0&&spans.every(x=>x.t0!==null)};
}
function tick(){
  if(!cur){raf=0;return}
  const t=player.currentTime,D=player.duration;
  if(D&&isFinite(D)){cur.bar.firstChild.style.width=Math.min(100,t/D*100)+'%';
    if(!cur.timed&&!cur.prop){const tot=cur.spans.reduce((a,x)=>a+x.len+1,0);let acc=0.05*D;const span=0.9*D;
      cur.spans.forEach(x=>{x.t0=acc;acc+=span*(x.len+1)/tot;x.t1=acc});cur.prop=true}
    cur.spans.forEach(x=>{if(x.t0===null)return;const on=t>=x.t0&&t<Math.max(x.t1,x.t0+0.12);x.sp.classList.toggle('on',on);x.sp.classList.toggle('past',!on&&t>=x.t1)})}
  raf=requestAnimationFrame(tick);
}
function endCur(full){cancelAnimationFrame(raf);raf=0;if(!cur)return;
  cur.spans.forEach(x=>{x.sp.classList.remove('on','past')});
  if(full)cur.bar.firstChild.style.width='100%';const b=cur.bar;cur=null;setTimeout(()=>{if(!cur||cur.bar!==b)b.classList.add('hidden')},500)}
player.ontimeupdate=()=>{if(cur&&!raf)tick()};
function seqNext(){if(!seq)return;seq.i++;if(seq.i>=seq.items.length){const d=seq.done;seq=null;d&&d(true);return}
  const it=seq.items[seq.i];seq.onStep&&seq.onStep(seq.i);_play(it[0],it[1],it[2])}
function playSeq(items,onStep,done){seq={items,i:0,onStep,done};onStep&&onStep(0);_play(items[0][0],items[0][1],items[0][2])}
function stopAudio(){const d=seq&&seq.done;seq=null;player.pause();endCur();if('speechSynthesis' in window)speechSynthesis.cancel();d&&d()}
function play(key,text,el){if(seq){const d=seq.done;seq=null;d&&d()}_play(key,text,el)}
function _play(key,text,el){ // must be called synchronously inside a tap handler (or from the 'ended' event of the same element)
  lastText=text;if('speechSynthesis' in window)speechSynthesis.cancel();
  endCur();
  try{player.pause();player.src='audio/'+key+'.mp3';applyRate();player.currentTime=0;
    const p=player.play();if(p&&p.catch)p.catch(err=>{if(err&&err.name!=='AbortError'){endCur();tts(text)}});
    cur=prepKaraoke(el,key);if(cur)raf=requestAnimationFrame(tick);
  }catch(e){tts(text)}
}
player.onplaying=()=>applyRate();
const wKey=i=>'w'+String(i).padStart(3,'0'),eKey=i=>'e'+String(i).padStart(3,'0');
// ---- speech (fallback) ----
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison|Alex/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

  const t=AC.currentTime,notes=ok?[659,880]:[220,175];notes.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t+k*.09);g.gain.linearRampToValueAtTime(.18,t+k*.09+.01);g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.22);o.connect(g).connect(AC.destination);o.start(t+k*.09);o.stop(t+k*.09+.25)})}catch(e){}}
function confetti(){const c=document.createElement('div');c.className='confetti';const em=['🎉','⭐','✨','🎊','💪','🔥'];
  for(let k=0;k<26;k++){const s=document.createElement('span');s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';s.style.fontSize=(18+Math.random()*18)+'px';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}
function addXP(n){S.xp=(S.xp||0)+n;S.xpDay=S.xpDay&&S.xpDay.d===T?S.xpDay:{d:T,n:0};S.xpDay.n+=n;save();head()}
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const norm=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();
function sentencePool(){const out=[];const learned=[...new Set([...todayIdx,...Object.keys(S.cards).map(Number)])];
  learned.forEach(i=>out.push({en:WORDS[i][3],zh:WORDS[i][4],key:eKey(i)}));
  out.push({en:sent[0],zh:sent[1],key:'s'+String(sIdx).padStart(3,'0')});
  DIALOGUES[todayDlg].l.forEach((l,j)=>out.push({en:l[1],zh:l[2],key:dKey(todayDlg,j)}));
  return out.filter(x=>{const n=x.en.split(/\s+/).length;return n>=3&&n<=8})}
function makeSession(){
  const learned=[...new Set([...todayIdx,...Object.keys(S.cards).map(Number)])];
  let bag=[];const pick=()=>{if(!bag.length)bag=shuffle(learned);return bag.pop()};
  const types=shuffle(['listen','meaning','fill','build','listen','build','fill','meaning']);
  const sp=shuffle(sentencePool());let si=0;
  return types.map(t=>{
    if(t==='build'&&sp.length)return {t,s:sp[si++%sp.length]};
    const i=pick();
    if(t==='fill'){const w=WORDS[i][0],ex=WORDS[i][3],k=ex.toLowerCase().indexOf(w.toLowerCase());if(k>=0)return {t,i,before:ex.slice(0,k),after:ex.slice(k+w.length)};return {t:'meaning',i}}

  });
}
let P=null;

    const firstTry=P.qs.filter(x=>!x.retry).length,acc=Math.round(Math.min(P.right,firstTry)/firstTry*100);const xp=P.xp+(acc===100?20:5);addXP(acc===100?20:5);

    $('againP').onclick=()=>{P={qs:makeSession(),k:0,right:0,xp:0};renderQuiz()};$('homeP').onclick=()=>{P=null;show('today')};return}
  const q=P.qs[P.k];

  top.innerHTML=`<button class="back" id="quitP" aria-label="退出" style="font-size:26px;min-width:48px;color:var(--sub)">✕</button><div class="progress grow" style="height:12px;border-radius:6px"><i style="width:${P.k/P.qs.length*100}%"></i></div><span class="tag">${P.k+1}/${P.qs.length}</span>`;
  box.appendChild(top);$('quitP').onclick=()=>{if(confirm('退出这组练习？进度不会保存。')){stopAudio();P=null;renderQuiz()}};

  const distract=i=>shuffle([i,...shuffle(WORDS.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]);

  }else{ // build sentence from tiles

  const L=$('wordList');L.innerHTML='<div class="label">已学单词（轻点朗读）</div>';
  if(!ids.length)L.innerHTML+='<p style="color:var(--sub);margin:0">还没有学习记录。</p>';
  ids.sort((a,b)=>(S.cards[b].seen>S.cards[a].seen)-(S.cards[b].seen<S.cards[a].seen)).forEach(i=>{
    const r=document.createElement('div');r.className='it';
    r.innerHTML=`<div><b class="w"></b><div class="m" style="color:var(--sub);font-size:14px"></div></div><span class="tag"></span>`;
    r.querySelector('.w').textContent=WORDS[i][0];r.querySelector('.m').textContent=WORD_HINTS[i][0]+' · '+WORDS[i][2];
    r.querySelector('.tag').textContent=S.cards[i].box>=4?'已掌握':`复习 ${S.cards[i].due.slice(5)}`;
    r.onclick=()=>play(wKey(i),WORDS[i][0],r.querySelector('.w'));L.appendChild(r)});
}
// speed control (all [data-speed] containers)
const RATES=[0.5,0.75,1,1.25,1.5];
function renderSpeed(){document.querySelectorAll('[data-speed]').forEach(c=>{
  if(!c.children.length)RATES.forEach(r=>{const b=document.createElement('button');b.textContent=r+'x';b.dataset.r=r;
    b.onclick=()=>{S.rate=r;save();renderSpeed();player.playbackRate=r;player.defaultPlaybackRate=r};c.appendChild(b)});
  [...c.children].forEach(b=>b.classList.toggle('on',+b.dataset.r===S.rate))})}
renderSpeed();
$('autoSw').onclick=()=>{S.auto=!S.auto;save();renderStats()};
$('resetBtn').onclick=()=>{if(confirm('确定清空所有学习记录？')){localStorage.removeItem(KEY);location.reload()}};

// ---- daily tasks / onboarding / mic / status ----
function tasks(){S.tasks=S.tasks&&S.tasks.d===T?S.tasks:{d:T,words:false,dlg:false,practice:false};return S.tasks}
function markTask(k){const t=tasks();if(t[k])return;t[k]=true;save();renderTasks();if(k==='dlg'&&$('toPractice'))$('toPractice').classList.remove('hidden');
  if(t.words&&t.dlg&&t.practice){setTimeout(()=>{confetti();toast('🎉 今日三项任务全部完成！明天见～')},400)}}
function renderTasks(){const t=tasks(),box=$('tasks');if(!box)return;
  const rows=[['words','📖','学 5 个新单词','先学今天的单词',`${(S.today&&S.today.d===T?S.today.done.length:0)}/5`],
    ['dlg','💬','练 1 段情景对话','听完整段，跟着读',DIALOGUES[todayDlg].t],
    ['practice','🎯','做 1 组练习','听音、填空、拼句子','8 题']];
  const n=rows.filter(r=>t[r[0]]).length;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><div class="label" style="margin:0">✅ 今日任务 ${n}/3</div><span class="tag">⭐ ${S.xpDay&&S.xpDay.d===T?S.xpDay.n:0} XP</span></div>`+
    rows.map((r,k)=>`<button class="task ${t[r[0]]?'done':''}" data-task="${r[0]}"><span class="ti">${t[r[0]]?'✓':r[1]}</span><span class="grow"><b>第${k+1}步 · ${r[2]}</b><small>${t[r[0]]?'已完成':r[3]} · ${esc(String(r[4]))}</small></span><span class="go">›</span></button>`).join('');
  box.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const k=b.dataset.task;
    if(k==='words'){$('learnBox').scrollIntoView({behavior:'smooth',block:'start'})}
    else if(k==='dlg'){dlgView={scene:null,d:todayDlg};show('dlg')}else show('quiz')})}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function onboarding(){if(S.onboarded)return;const steps=[
  ['👋','欢迎来到每日英语','每天只要 10 分钟。按顺序完成“今日任务”三步就行：学单词 → 练对话 → 做练习。'],
  ['🔊','点喇叭就能听','所有句子都有真人风格的录音。播放时会高亮正在读的单词，还能调 0.5x～1.5x 速度。灰色小字是“谐音”提示，帮你开口。'],
  ['🎤','跟着读，越说越好','点 🎤 录下自己的声音，和原音对比。做练习赚 XP，连续打卡攒 🔥。准备好了吗？']];
  let k=0;const o=document.createElement('div');o.className='onb';
  const draw=()=>{const s=steps[k];o.innerHTML=`<div class="onb-card pop"><div class="e">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p><div class="dots">${steps.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div><button class="btn primary full">${k<2?'下一步':'开始学习'}</button>${k<2?'<button class="skip">跳过</button>':''}</div>`;
    o.querySelector('.btn').onclick=()=>{if(k<2){k++;draw()}else{S.onboarded=1;save();o.remove()}};
    const sk=o.querySelector('.skip');if(sk)sk.onclick=()=>{S.onboarded=1;save();o.remove()}};
  draw();document.body.appendChild(o)}
// 跟读: record with MediaRecorder, then play back
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let rec=null,recBtn=null,myClips={};
if(!canRec)document.querySelectorAll('.mic').forEach(b=>b.remove());
function micBtn(id){if(!canRec)return '';return `<button class="spk mic" data-mic="${id}" aria-label="跟读录音">🎤</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mic]');if(!b)return;
  const id=b.dataset.mic;
  if(rec&&rec.state==='recording'){rec.stop();return}
  stopAudio();
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const chunks=[];rec=new MediaRecorder(stream);recBtn=b;b.classList.add('recording');b.textContent='■';toast('🎙️ 正在录音… 读完再点一次 ■ 停止');
    rec.ondataavailable=ev=>ev.data&&ev.data.size&&chunks.push(ev.data);
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());b.classList.remove('recording');b.textContent='🎤';
      const blob=new Blob(chunks,{type:rec.mimeType||'audio/mp4'});if(myClips[id])URL.revokeObjectURL(myClips[id]);myClips[id]=URL.createObjectURL(blob);
      let mb=b.parentNode.querySelector('.mine');if(!mb){mb=document.createElement('button');mb.className='btn mine';mb.textContent='▶ 听我的';b.after(mb)}
      mb.onclick=()=>{endCur();player.src=myClips[id];player.playbackRate=1;player.play().catch(()=>{})};
      mb.onclick();toast('▶ 正在播放你的录音，再点 🔊 听原音对比');};
    rec.start();setTimeout(()=>{if(rec&&rec.state==='recording'&&recBtn===b)rec.stop()},12000);
  }).catch(()=>toast('无法使用麦克风：请在弹窗中点“允许”'))});
// offline / audio download status
function setNet(txt,cls){const n=$('netTxt');if(n){n.textContent=txt;n.className='pill '+(cls||'')}}
let audioProg=null;
function updNet(){if(!navigator.onLine)setNet(audioProg&&audioProg.done>=audioProg.total?'离线模式 · 可正常使用':'离线模式','warn');
  else if(audioProg&&audioProg.done<audioProg.total)setNet(`下载语音 ${Math.round(audioProg.done/audioProg.total*100)}%`,'busy');
  else if(audioProg)setNet('✓ 已可离线使用','ok');else setNet('','')}
addEventListener('online',updNet);addEventListener('offline',updNet);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.t==='audio'){audioProg=e.data;updNet()}});

// ---- nav ----
const titles={today:'今日英语',dlg:'场景对话',review:'复习',quiz:'练习',stats:'学习进度'};
function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['today','dlg','review','quiz','stats'].forEach(k=>$('v-'+k).classList.toggle('hidden',k!==v));
  $('title').textContent=titles[v];stopAudio();
  ({today:()=>renderToday(false),dlg:renderDlg,review:renderReview,quiz:renderQuiz,stats:renderStats})[v]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
// reload on a new day when app resumes from background
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&todayStr()!==T)location.reload()});
head();renderToday(false);renderTasks();updNet();onboarding();
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});
    // start the background audio download a few seconds after the page is usable
    setTimeout(()=>navigator.serviceWorker.ready.then(reg=>reg.active&&reg.active.postMessage('cache-audio')),4000)}).catch(()=>{});
}
})();
</script>
